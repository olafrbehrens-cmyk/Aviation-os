<!DOCTYPE html>
<html lang="af">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation OS</title>
    
    <!-- Tailwind CSS vir die mooi kleure en uitleg -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome vir die ikone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .animate-fadeIn { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Tailwind custom config */
        tailwind.config = {
            theme: {
                extend: { colors: { slate: { 850: '#151e2e', 905: '#0d131f' } } }
            }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">

    <div id="root"></div>

    <!-- Die hoof React Kode -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const PRESET_WAYPOINTS = [
            { id: 'FAEC', name: "Eagle's Creek", lat: -25.9075, lng: 28.0358 },
            { id: 'LTV', name: "Lanseria VOR", lat: -25.9383, lng: 27.9261 },
            { id: 'PAR', name: "Parys Airport", lat: -26.9032, lng: 27.5097 },
            { id: 'FABO', name: "Bothaville Airport", lat: -27.3667, lng: 26.6333 }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isPlaying, setIsPlaying] = useState(false);
            const [simProgress, setSimProgress] = useState(0);
            const [altitude, setAltitude] = useState(4700);
            const [airspeed, setAirspeed] = useState(0);
            const simInterval = useRef(null);

            // Simulasie Logika
            useEffect(() => {
                if (isPlaying) {
                    simInterval.current = setInterval(() => {
                        setSimProgress((prev) => {
                            const next = prev + 1;
                            if (next >= 100) {
                                setIsPlaying(false);
                                clearInterval(simInterval.current);
                                return 100;
                            }
                            if (next < 15) {
                                setAltitude(4700 + Math.round((next / 15) * 3800));
                                setAirspeed(Math.round(85 + (next / 15) * 80));
                            } else if (next > 80) {
                                setAltitude(8500 - Math.round(((next - 80) / 20) * 4264));
                                setAirspeed(Math.round(165 - ((next - 80) / 20) * 80));
                            } else {
                                setAltitude(8500);
                                setAirspeed(172);
                            }
                            return next;
                        });
                    }, 800);
                } else {
                    clearInterval(simInterval.current);
                }
                return () => clearInterval(simInterval.current);
            }, [isPlaying]);

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="px-6 py-4 border-b border-slate-800 bg-slate-900/80 sticky top-0 z-50 flex justify-between items-center">
                        <div className="flex items-center space-x-3">
                            <div className="bg-sky-600 p-2 rounded-lg text-white">
                                <i className="fas fa-plane"></i>
                            </div>
                            <div>
                                <h1 className="text-xl font-bold tracking-tight">AVIATION OS</h1>
                                <p className="text-xs opacity-60">Web Prototype v1.0</p>
                            </div>
                        </div>
                        <div className="bg-amber-500/10 text-amber-500 border border-amber-500/20 px-3 py-1 rounded text-xs">
                            <i className="fas fa-exclamation-triangle mr-1"></i> SIMULATED DATA ONLY
                        </div>
                    </header>

                    <div className="flex flex-grow">
                        {/* Sidebar */}
                        <nav className="w-64 border-r border-slate-850 bg-slate-900 p-4 hidden md:block">
                            <div className="space-y-2">
                                {[
                                    { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-line' },
                                    { id: 'flightplanner', label: 'Flight Planner', icon: 'fa-clipboard-list' },
                                    { id: 'map', label: 'Live Map', icon: 'fa-map' },
                                    { id: 'cockpit', label: 'Cockpit View', icon: 'fa-location-arrow' }
                                ].map(item => (
                                    <button
                                        key={item.id}
                                        onClick={() => setActiveTab(item.id)}
                                        className={`w-full text-left px-4 py-3 rounded-lg text-sm transition-colors ${
                                            activeTab === item.id ? 'bg-sky-600 text-white' : 'text-slate-400 hover:bg-slate-800'
                                        }`}
                                    >
                                        <i className={`fas ${item.icon} w-6`}></i> {item.label}
                                    </button>
                                ))}
                            </div>
                        </nav>

                        {/* Hoof Inhoud */}
                        <main className="flex-grow p-6">
                            
                            {/* DASHBOARD TAB */}
                            {activeTab === 'dashboard' && (
                                <div className="animate-fadeIn space-y-6">
                                    <h2 className="text-3xl font-extrabold">Command Dashboard</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div className="p-6 bg-slate-900 border border-slate-800 rounded-xl">
                                            <div className="text-xs uppercase opacity-60 mb-2">Active Route</div>
                                            <div className="text-2xl font-bold text-sky-400">FAEC <i className="fas fa-arrow-right text-sm"></i> FABO</div>
                                            <div className="text-sm mt-2 opacity-75">Cirrus SR22T G7+</div>
                                        </div>
                                        
                                        <div className="col-span-2 p-6 bg-slate-900 border border-slate-800 rounded-xl">
                                            <h3 className="text-lg font-bold mb-4">Simulation Control</h3>
                                            <div className="flex gap-4">
                                                <button 
                                                    onClick={() => setIsPlaying(!isPlaying)}
                                                    className={`px-6 py-3 rounded-xl font-bold flex-grow ${isPlaying ? 'bg-amber-500 text-black' : 'bg-sky-600 text-white'}`}
                                                >
                                                    <i className={`fas ${isPlaying ? 'fa-pause' : 'fa-play'} mr-2`}></i>
                                                    {isPlaying ? 'Pause Sim' : 'Launch Flight'}
                                                </button>
                                                <button 
                                                    onClick={() => { setSimProgress(0); setAltitude(4700); setAirspeed(0); setIsPlaying(false); }}
                                                    className="px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700"
                                                >
                                                    <i className="fas fa-undo"></i> Reset
                                                </button>
                                            </div>
                                            <div className="mt-4 bg-black/40 p-4 rounded text-sm font-mono flex justify-between">
                                                <span>Alt: {altitude} FT</span>
                                                <span>Speed: {airspeed} KT</span>
                                                <span className="text-sky-400">Progress: {simProgress}%</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* MAP TAB */}
                            {activeTab === 'map' && (
                                <div className="animate-fadeIn space-y-6">
                                    <h2 className="text-3xl font-extrabold">VFR Tracking Map</h2>
                                    <div className="h-96 bg-slate-950 border border-slate-800 rounded-2xl relative overflow-hidden flex items-center justify-center">
                                        <svg className="absolute inset-0 w-full h-full" viewBox="0 0 1000 500">
                                            {/* Route Line */}
                                            <path d="M 300 150 L 700 350" stroke="#0ea5e9" strokeWidth="2" strokeDasharray="5,5" />
                                            
                                            {/* Waypoints */}
                                            <circle cx="300" cy="150" r="6" fill="#10b981" />
                                            <text x="315" y="155" fill="white" className="text-xs">FAEC (Eagle's Creek)</text>

                                            <circle cx="700" cy="350" r="6" fill="#ef4444" />
                                            <text x="715" y="355" fill="white" className="text-xs">FABO (Bothaville)</text>

                                            {/* Moving Plane */}
                                            {(() => {
                                                const curX = 300 + (400 * (simProgress/100));
                                                const curY = 150 + (200 * (simProgress/100));
                                                return (
                                                    <g transform={`translate(${curX}, ${curY})`}>
                                                        <circle r="15" fill="#38bdf8" fillOpacity="0.2" className="animate-ping" />
                                                        <circle r="6" fill="#38bdf8" />
                                                    </g>
                                                )
                                            })()}
                                        </svg>
                                    </div>
                                </div>
                            )}

                             {/* COCKPIT TAB */}
                             {activeTab === 'cockpit' && (
                                <div className="animate-fadeIn space-y-6">
                                    <h2 className="text-3xl font-extrabold">HUD Cockpit Data</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="p-10 bg-slate-900 border border-slate-800 rounded-xl text-center">
                                            <div className="text-sm uppercase opacity-50 mb-2">Altitude (Indicated)</div>
                                            <div className="text-6xl font-black text-white bg-slate-950 py-4 rounded border border-slate-800">{altitude} <span className="text-lg text-sky-400">FT</span></div>
                                        </div>
                                        <div className="p-10 bg-slate-900 border border-slate-800 rounded-xl text-center">
                                            <div className="text-sm uppercase opacity-50 mb-2">Airspeed (True)</div>
                                            <div className="text-6xl font-black text-white bg-slate-950 py-4 rounded border border-slate-800">{airspeed} <span className="text-lg text-emerald-400">KT</span></div>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>
                </div>
            );
        }

        // Laai die app in die DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
